name: One-time MAP-REG registry reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-map-registry-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[registry-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile AST-MAP-002 and regenerate mirrors
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          manifest_path = Path('manifest.json')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          assets = data['assets']
          target = next(a for a in assets if a['asset_id'] == 'AST-MAP-002')
          target.update({
              'title': 'MAP-REG-001 — First-Playable Region GM Reference',
              'category': 'map',
              'context': 'Campaign One: The Last Quiet Spring / First-Playable March',
              'purpose': 'GM-facing regional reference showing only approved approximate geographic anchors and explicitly held unknown geography.',
              'subjects': 'GEO-000003, GEO-000004, GEO-000006, GEO-000007, GEO-000008, GEO-000009; held GEO-000002, GEO-000005, GEO-000010; ROUTE/GXR topology annotations only',
              'required_dimensions': 'Scalable SVG master; current approved GM review-stage draft uses a 1600x1000 viewBox; publication dimensions TBD',
              'status': 'approved',
              'version': 'v002',
              'drive_file_id': '1HKS3TPvCenAKeqC77glZtgT2xXwUwogkDv3AVL8OEdE',
              'drive_url': 'https://docs.google.com/document/d/1HKS3TPvCenAKeqC77glZtgT2xXwUwogkDv3AVL8OEdE/edit',
              'drive_path': 'Aramyst / atlas authority — MAP-REG-001 Geometry Specification v001 — CONTROLLING',
              'github_source_path': 'maps/map-reg-001-gm-reference-v002.svg',
              'github_export_path': '',
              'prompt_reference_path': '',
              'owner': 'TBD',
              'dependencies': [
                  'ATLAS-ARCH-001',
                  'ATLAS-REG-DATA-001',
                  'MAP-REG-001 Geometry Specification v001 — CONTROLLING',
                  'GEO-000002–GEO-000010',
                  'ROUTE-000001–ROUTE-000007',
                  'GXR-000001–GXR-000016',
              ],
              'approval': 'Approved GM review-stage asset; independence/no-invention acceptance gate PASS 2026-08-13; player-facing derivative blocked',
              'notes': 'Bottom-up regional atlas asset bound to MAP-REG-001 GM Reference Vector Draft v002. Does not depend on a completed world map. Geographic authorities: ATLAS-REG-DATA-001 and MAP-REG-001 Geometry Specification v001 — CONTROLLING. Acceptance audit: Drive 1CwRkw-MXqJzwtHPYwkT3-2z_I_Hn-pUNgLSqYxRyBjk. v001 SVG is superseded and retained only for history. No roads, river courses, terrain, March boundary, distances, travel scale, additional settlements, route junctions, or external-source geometry are authorized.',
          })

          if not any(a['asset_id'] == 'AST-MAP-003' for a in assets):
              raise SystemExit('AST-MAP-003 missing; refusing to invent a replacement record')

          manifest_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          fields = [
              'asset_id','title','category','context','purpose','status','version',
              'drive_file_id','drive_url','drive_path','github_source_path',
              'github_export_path','prompt_reference_path','owner','dependencies',
              'approval','required_dimensions','subjects','notes'
          ]
          with Path('ASSET_MANIFEST.csv').open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for asset in assets:
                  row = {field: asset.get(field, '') for field in fields}
                  row['dependencies'] = '; '.join(asset.get('dependencies', []))
                  writer.writerow(row)

          status_meaning = {
              'planned': 'Identified but not fully defined.',
              'briefed': 'Requirements and purpose are defined.',
              'in-progress': 'Active generation, illustration, composition, or revision is underway.',
              'review': 'A specific version is ready for creative, canon, and production review.',
              'approved': 'The version is accepted for its intended use.',
              'exported': 'A delivery-ready output exists at its registered path.',
              'published': 'The asset appears in a released product.',
              'superseded': 'Replaced by another version or asset.',
              'archived': 'Retained for history but excluded from active production.',
          }
          md = []
          md += ['# Aramyst Asset Manifest', '', 'Canonical human-readable registry for Aramyst visual assets. `manifest.json` is the machine-readable source; this file and `ASSET_MANIFEST.csv` are generated mirrors.', '']
          md += ['## Rules', '', '1. Asset IDs are permanent and never reused.', '2. Versions use `v001` format and change only for material revisions.', '3. Status/version/path changes must be synchronized across JSON, CSV, and Markdown.', '4. Drive owns briefs and working records; GitHub owns identity, status, version, validation, page order, and release-ready exports.', '5. Fixed-layout page order is governed by `manifest.json`.', '']
          md += ['## Status Values', '', '| Status | Meaning |', '|---|---|']
          for key, meaning in status_meaning.items():
              md.append(f'| {key} | {meaning} |')
          md += ['', '## Master Asset Index', '', '| Asset ID | Title | Category | Context | Status | Version | Source | Export |', '|---|---|---|---|---|---|---|---|']
          for a in assets:
              source = a.get('github_source_path') or a.get('drive_path') or '—'
              export = a.get('github_export_path') or '—'
              md.append(f"| {a['asset_id']} | {a['title']} | {a['category']} | {a['context']} | {a['status']} | {a['version']} | {source} | {export} |")
          md += ['', '## Detailed Asset Records', '']
          labels = [
              ('category','Category'),('context','Context'),('purpose','Purpose'),('subjects','Subjects'),
              ('required_dimensions','Required Dimensions'),('drive_file_id','Drive File ID'),('drive_url','Drive URL'),
              ('drive_path','Drive Path'),('github_source_path','GitHub Source Path'),('github_export_path','GitHub Export Path'),
              ('prompt_reference_path','Prompt / Reference'),('owner','Owner'),('dependencies','Dependencies'),
              ('approval','Approval'),('notes','Notes')
          ]
          for a in assets:
              md += [f"### {a['asset_id']} — {a['title']}", '']
              md.append(f"- **Status / Version:** {a['status']} / {a['version']}")
              for key, label in labels:
                  value = a.get(key, '')
                  if key == 'dependencies':
                      value = '; '.join(value)
                  if value == '':
                      value = '—'
                  md.append(f'- **{label}:** {value}')
              md.append('')
          md += ['## Change Log', '', '| Date | Change | Result |', '|---|---|---|', '| 2026-08-13 | AST-MAP-002 registry reconciliation | Bound v002 GM SVG; regional-data-first authority recorded; no-invention gate PASS; player-facing derivative remains blocked. |', '| 2026-08-13 | AST-MAP-003 synchronization | Existing MAP-ENV-001 approved local schematic included in all registry mirrors. |', '']
          Path('docs/ASSET_MANIFEST.md').write_text('\n'.join(md), encoding='utf-8')
          PY

          python scripts/validate_manifest.py

      - name: Commit synchronized registry and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/sync-map-registry-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json ASSET_MANIFEST.csv docs/ASSET_MANIFEST.md .github/workflows/sync-map-registry-once.yml
          git commit -m '[registry-sync] Reconcile AST-MAP-002 v002 and manifest mirrors'
          git push
