name: Validate Aramyst Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Compile validator
        run: python -m py_compile scripts/validate_manifest.py

      - name: Run validator regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate manifests and page registry
        run: python scripts/validate_manifest.py
