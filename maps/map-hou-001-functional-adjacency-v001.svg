<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill:#111; }
      .sub { font: 19px Arial, sans-serif; fill:#333; }
      .nodeTitle { font: 700 21px Arial, sans-serif; fill:#111; }
      .nodeSub { font: 15px Arial, sans-serif; fill:#333; }
      .edgeLabel { font: 700 13px Arial, sans-serif; fill:#222; }
      .small { font: 14px Arial, sans-serif; fill:#333; }
      .tiny { font: 12px Arial, sans-serif; fill:#444; }
      .box { fill:#fff; stroke:#222; stroke-width:2; rx:14; }
      .hold { fill:#fff; stroke:#777; stroke-width:2; stroke-dasharray:8 6; rx:12; }
      .labelbg { fill:#fff; opacity:0.94; }
      .publicEdge { stroke:#222; stroke-width:4; fill:none; marker-end:url(#arrow); }
      .controlledEdge { stroke:#444; stroke-width:3; stroke-dasharray:10 8; fill:none; marker-end:url(#arrow); }
      .functionalEdge { stroke:#666; stroke-width:3; stroke-dasharray:3 7; fill:none; }
      .interfaceEdge { stroke:#555; stroke-width:3; stroke-dasharray:12 6 2 6; fill:none; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#fff"/>
  <text x="70" y="65" class="title">MAP-HOU-001 — Last-Bell House Functional-Adjacency Schematic v001</text>
  <text x="70" y="102" class="sub">NON-METRIC • FUNCTIONAL RELATIONSHIPS ONLY • NOT A FLOORPLAN • GEO-000004 SUBFEATURES ONLY</text>

  <!-- Public arrival chain -->
  <rect x="70" y="300" width="230" height="135" class="box"/>
  <text x="185" y="344" text-anchor="middle" class="nodeTitle">Street Court</text>
  <text x="185" y="378" text-anchor="middle" class="nodeSub">PUBLIC / EXTERIOR</text>
  <text x="185" y="407" text-anchor="middle" class="tiny">public gathering without deeper entry</text>

  <rect x="390" y="300" width="240" height="135" class="box"/>
  <text x="510" y="344" text-anchor="middle" class="nodeTitle">Threshold Porch</text>
  <text x="510" y="378" text-anchor="middle" class="nodeSub">PUBLIC / EXTERIOR</text>
  <text x="510" y="407" text-anchor="middle" class="tiny">approved MAP-ENV exterior interface</text>

  <rect x="720" y="285" width="260" height="165" class="box"/>
  <text x="850" y="332" text-anchor="middle" class="nodeTitle">Petition Hall</text>
  <text x="850" y="367" text-anchor="middle" class="nodeSub">PUBLIC PROCEDURAL</text>
  <text x="850" y="397" text-anchor="middle" class="tiny">principal distribution point for deeper functions</text>
  <text x="850" y="421" text-anchor="middle" class="tiny">no direct-door/shared-wall claim</text>

  <path d="M300 367 L390 367" class="publicEdge"/>
  <rect x="310" y="330" width="70" height="30" class="labelbg"/>
  <text x="345" y="345" text-anchor="middle" class="edgeLabel">PUBLIC</text>
  <text x="345" y="359" text-anchor="middle" class="tiny">arrival order</text>

  <path d="M630 367 L720 367" class="publicEdge"/>
  <rect x="640" y="330" width="70" height="30" class="labelbg"/>
  <text x="675" y="345" text-anchor="middle" class="edgeLabel">PUBLIC</text>
  <text x="675" y="359" text-anchor="middle" class="tiny">arrival order</text>

  <!-- Threshold/lamp -->
  <rect x="390" y="545" width="240" height="130" class="box"/>
  <text x="510" y="588" text-anchor="middle" class="nodeTitle">Lamp Niche</text>
  <text x="510" y="621" text-anchor="middle" class="nodeSub">PUBLIC / EXTERIOR FIXTURE</text>
  <text x="510" y="650" text-anchor="middle" class="tiny">inherits approved O-L positive visibility</text>
  <path d="M510 435 L510 545" class="interfaceEdge"/>
  <rect x="535" y="478" width="285" height="54" class="labelbg"/>
  <text x="548" y="496" class="edgeLabel">SAME EXTERIOR PROCEDURAL INTERFACE</text>
  <text x="548" y="518" class="tiny">not a façade, wall-face, or door-position claim</text>

  <!-- Deeper controlled / received branches -->
  <rect x="1180" y="155" width="270" height="140" class="box"/>
  <text x="1315" y="198" text-anchor="middle" class="nodeTitle">Witness Room</text>
  <text x="1315" y="232" text-anchor="middle" class="nodeSub">CONTROLLED / SENSITIVE</text>
  <text x="1315" y="262" text-anchor="middle" class="tiny">not a mandatory passage-through space</text>

  <rect x="1180" y="335" width="270" height="140" class="box"/>
  <text x="1315" y="378" text-anchor="middle" class="nodeTitle">Record Room</text>
  <text x="1315" y="412" text-anchor="middle" class="nodeSub">CONTROLLED / SENSITIVE</text>
  <text x="1315" y="442" text-anchor="middle" class="tiny">record existence ≠ unrestricted access</text>

  <rect x="1180" y="550" width="270" height="140" class="box"/>
  <text x="1315" y="593" text-anchor="middle" class="nodeTitle">Guest Hall</text>
  <text x="1315" y="627" text-anchor="middle" class="nodeSub">RECEIVED / CONDITIONAL</text>
  <text x="1315" y="657" text-anchor="middle" class="tiny">reachable without crossing records/witness space</text>

  <path d="M980 330 C1060 295, 1090 250, 1180 225" class="controlledEdge"/>
  <rect x="995" y="220" width="185" height="45" class="labelbg"/>
  <text x="1008" y="238" class="edgeLabel">CONTROLLED ACCESS REQUIRED</text>
  <text x="1008" y="258" class="tiny">physical adjacency held</text>

  <path d="M980 367 L1180 405" class="controlledEdge"/>
  <rect x="1000" y="372" width="185" height="45" class="labelbg"/>
  <text x="1013" y="390" class="edgeLabel">CONTROLLED ACCESS REQUIRED</text>
  <text x="1013" y="410" class="tiny">physical adjacency held</text>

  <path d="M950 450 C1030 500, 1090 575, 1180 620" class="controlledEdge"/>
  <rect x="990" y="505" width="230" height="45" class="labelbg"/>
  <text x="1003" y="523" class="edgeLabel">RECEIVED / CONDITIONAL REACHABILITY</text>
  <text x="1003" y="543" class="tiny">exact route and adjacency held</text>

  <!-- Archive -->
  <rect x="1520" y="335" width="220" height="140" class="box"/>
  <text x="1630" y="378" text-anchor="middle" class="nodeTitle">Back Archive Loft</text>
  <text x="1630" y="412" text-anchor="middle" class="nodeSub">CONTROLLED / SENSITIVE</text>
  <text x="1630" y="442" text-anchor="middle" class="tiny">vertical relation / physical form held</text>
  <path d="M1450 405 L1520 405" class="functionalEdge"/>
  <rect x="1456" y="350" width="265" height="43" class="labelbg"/>
  <text x="1468" y="368" class="edgeLabel">FUNCTIONAL CONNECTION REQUIRED</text>
  <text x="1468" y="388" class="tiny">not direct-adjacency proof</text>

  <!-- Household/service network -->
  <rect x="1180" y="795" width="270" height="140" class="box"/>
  <text x="1315" y="838" text-anchor="middle" class="nodeTitle">Kitchen &amp; Winter Store</text>
  <text x="1315" y="872" text-anchor="middle" class="nodeSub">HOUSEHOLD / SERVICE</text>
  <text x="1315" y="902" text-anchor="middle" class="tiny">supports guest reception / household feeding</text>

  <rect x="1520" y="795" width="220" height="140" class="box"/>
  <text x="1630" y="838" text-anchor="middle" class="nodeTitle">Service Yard</text>
  <text x="1630" y="872" text-anchor="middle" class="nodeSub">HOUSEHOLD / SERVICE</text>
  <text x="1630" y="902" text-anchor="middle" class="tiny">public/service entrance relation unresolved</text>

  <path d="M1315 690 L1315 795" class="functionalEdge"/>
  <rect x="1335" y="724" width="275" height="44" class="labelbg"/>
  <text x="1347" y="742" class="edgeLabel">FUNCTIONAL SUPPORT CONNECTION</text>
  <text x="1347" y="762" class="tiny">pairwise physical adjacency not asserted</text>

  <path d="M1450 865 L1520 865" class="functionalEdge"/>
  <rect x="1455" y="810" width="270" height="43" class="labelbg"/>
  <text x="1467" y="828" class="edgeLabel">SERVICE SUPPORT CONNECTION</text>
  <text x="1467" y="848" class="tiny">door/floor/yard position held</text>

  <!-- Burial / bell: reachability only, no path origin asserted -->
  <rect x="720" y="760" width="260" height="140" class="hold"/>
  <text x="850" y="803" text-anchor="middle" class="nodeTitle">Burial Court</text>
  <text x="850" y="837" text-anchor="middle" class="nodeSub">BURIAL / KIN-CONTROLLED</text>
  <text x="850" y="867" text-anchor="middle" class="tiny">CONTROLLED REACHABILITY APPROVED</text>
  <text x="850" y="889" text-anchor="middle" class="tiny">origin, path, and adjacency NOT ESTABLISHED</text>

  <rect x="720" y="950" width="260" height="125" class="hold"/>
  <text x="850" y="993" text-anchor="middle" class="nodeTitle">Bell Stair</text>
  <text x="850" y="1027" text-anchor="middle" class="nodeSub">PUBLIC NOTICE / HOUSE OPERATION</text>
  <text x="850" y="1057" text-anchor="middle" class="tiny">operational reachability approved; attachment/path held</text>

  <!-- Explicit service/public separation note -->
  <rect x="1050" y="990" width="690" height="85" class="hold"/>
  <text x="1075" y="1022" class="edgeLabel">SERVICE/PUBLIC SEPARATION — APPROVED FUNCTIONAL PRINCIPLE</text>
  <text x="1075" y="1048" class="small">Service Yard access and Street Court/Threshold public arrival are distinct access modes.</text>
  <text x="1075" y="1071" class="small">No shared entrance, lane, yard, doorway, or physical intersection is established.</text>

  <!-- Legend -->
  <rect x="70" y="760" width="560" height="315" class="hold"/>
  <text x="95" y="800" class="nodeTitle">Legend / Control Notes</text>
  <line x1="100" y1="835" x2="180" y2="835" class="publicEdge"/>
  <text x="205" y="840" class="small">Approved public access sequence</text>
  <line x1="100" y1="875" x2="180" y2="875" class="controlledEdge"/>
  <text x="205" y="880" class="small">Controlled/conditional access relationship</text>
  <line x1="100" y1="915" x2="180" y2="915" class="functionalEdge"/>
  <text x="205" y="920" class="small">Functional connection; physical form held</text>
  <line x1="100" y1="955" x2="180" y2="955" class="interfaceEdge"/>
  <text x="205" y="960" class="small">Interface annotation; non-spatial</text>
  <text x="95" y="1000" class="small">All unshown adjacencies: NOT ESTABLISHED.</text>
  <text x="95" y="1028" class="small">No floor, footprint, wall, door, corridor, dimensions, scale, compass face,</text>
  <text x="95" y="1052" class="small">architectural style, or external-source geometry is asserted.</text>

  <text x="70" y="1155" class="tiny">Authority: approved HOU-SD-001–012; REL-CHAP-HOUSE-001; MAP-ENV-001 threshold/lamp interface; SCN-NODE-001.</text>
  <text x="70" y="1177" class="tiny">Drawing coordinates are production coordinates only. This schematic does not establish floor count, route length, wall orientation, adjacency where held, or any architectural footprint.</text>
</svg>
